[program:vite]
; L'uid non si passa: lo ricava lo script dal proprietario dell'albero montato — il perche' sta
; scritto la' dentro, insieme a cosa e' stato provato e non funziona (l'opzione `user`).
command=/var/www/docker/supervisor/run-vite.sh
directory=/var/www
; L'uid dell'host dentro il container non ha una casa, e npm scrive la sua cache in $HOME: senza
; questo cercherebbe /root/.npm, che non e' sua. Verificato: `npm config get cache` risponde
; /root/.npm senza HOME e /tmp/.npm con HOME=/tmp.
environment=HOME="/tmp"
autostart=true
autorestart=true
