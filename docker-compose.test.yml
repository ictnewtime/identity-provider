# Ambiente dei test **E2E**. Non sostituisce `docker-compose.yml`: gli sta accanto.
#
# PERCHE' QUESTO FILE ESISTE, e perche' i test di backend non ce l'hanno (decisione D4 del task
# docs/task/todo/20260812-local-environments/):
#
#   - i test di BACKEND girano su sqlite in memoria, che vive dentro il processo di PHP e muore
#     con lui: nessun servizio deve restare su, quindi basta un comando. Sono
#     `Dockerfile.test.backend` + `.env.test.backend.example`, senza compose;
#   - i test E2E hanno il vincolo opposto: un browser vero interroga un'applicazione viva, che ha
#     bisogno di un database che risponda dall'inizio alla fine della sessione. Servizi che
#     restano su e si vedono fra loro: **e' quello che un file compose esprime**.
#
# Da cui anche la scelta del database: qui **MariaDB `idp_test`**, non sqlite. Oltre al vincolo
# sopra, c'e' un fatto misurato — `LIKE` su una lettera accentata maiuscola trova 0 righe su
# sqlite e 1 su MariaDB, e la ricerca di questa applicazione e' fatta di `LIKE`.
#
#     docker compose -f docker-compose.test.yml run --rm --build e2e
#
# INCOMPLETO: manca il servizio Cypress, che arriva con TEC03 di
# docs/task/todo/20260812-e2e-test-container/ — all'immagine dell'applicazione mancano tutte le
# librerie che gli servono. Oggi questo file da' l'ambiente e il database; il browser no.
#
# Cosa NON tocca, ed e' il motivo per cui esiste:
#   - il database di sviluppo `idp_develop`, che resta del developer;
#   - il file `.env` dell'host, che non viene ne' letto come autorevole ne' riscritto;
#   - `bootstrap/cache/` dell'host, deviata con APP_CONFIG_CACHE.
#
# Il codice si monta, cosi' non serve ricostruire l'immagine a ogni modifica. Le variabili qui
# sotto vincono su qualunque file `.env` e su `phpunit.xml`, perche' l'ambiente del processo ha
# la precedenza (verificato il 2026-08-12).

services:
    e2e:
        build:
            context: .
            dockerfile: Dockerfile.test.e2e
        container_name: idp_e2e_runner
        working_dir: /var/www
        volumes:
            - ./:/var/www
        environment:
            APP_ENV: testing
            # Il database dei test: creato dall'entrypoint con IF NOT EXISTS a ogni avvio.
            DB_CONNECTION: mysql
            # Il NOME DEL SERVIZIO del docker-compose di sviluppo, non il container_name.
            DB_HOST: idp_mariadb_2
            DB_PORT: 3306
            DB_DATABASE: idp_test
            DB_USERNAME: root
            DB_PASSWORD: 123
            # I soli database su cui la suite ha il permesso di girare. Il guardiano in
            # tests/TestCase.php aborta prima di qualunque migrazione se non e' fra questi.
            TEST_ALLOWED_DATABASES: ":memory:,idp_test"
            # Config cache deviata fuori dall'albero montato: `config:clear` e `config:cache`
            # non toccano piu' quella dell'applicazione di sviluppo.
            APP_CONFIG_CACHE: /tmp/config-test.php
        networks:
            - idp_network

networks:
    # La rete la crea `docker-compose.yml`: qui ci si aggancia, non la si ridefinisce.
    # Il nome vero e' `<progetto>_idp_network`, e con `name:` si punta a quello.
    idp_network:
        name: identity-provider2_idp_network
        external: true
